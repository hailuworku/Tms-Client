<!-- 1. የእንኳን ደህና መጣህ ክፍል -->
<div style="background: #f0f7ff; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #d1e9ff;">
  <h2>Welcome back, {{ studentName() }}</h2>
  <p>Status: <strong>{{ graduationStatus() }}</strong> | Credits: {{ earnedCredits() }}</p>
  <button (click)="registerForClass()">Add Credits</button>
</div>

<!-- 2. ሰመሪያው (Pending/Approved ቁጥሮች) -->

<hr style="margin: 30px 0;">

<!-- 3. የኮርስ ካርዶች -->
<h3>Available Courses</h3>
<div style="display: flex; gap: 15px; flex-wrap: wrap;">
  @for (c of coursesResource.value() ?? []; track c.id) {
    <tms-course-card [course]="c" (enrollClicked)="handleEnroll($event)" />
  }
</div>

<hr style="margin: 30px 0;">

<!-- 4. የተማሪዎች ዝርዝር (Approve ማድረጊያው) -->
